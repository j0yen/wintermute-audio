[package]
name = "wintermute-audio"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
# Strict everyday lints
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# BAD_RUST-aligned restrictions: error on dishonest patterns
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"
mem_forget = "deny"
as_conversions = "warn"
float_arithmetic = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

# Tame pedantic noise without weakening BAD_RUST coverage
module_name_repetitions = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[lib]
name = "wintermute_audio"
path = "src/lib.rs"

[[bin]]
name = "wm-audio"
path = "src/main.rs"

[[bin]]
name = "wm-audio-dump"
path = "src/bin/wm-audio-dump.rs"

[dependencies]
agorabus = { path = "../agorabus" }
anyhow = "1"
base64 = "0.22"
hex = "0.4"
ndarray = "0.16"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "copy-dylibs", "tls-rustls"] }
ringbuf = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "io-util", "net", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "test-util", "process", "fs", "io-util", "net"] }

[features]
# `aec` (default-on) gates the PipeWire echo-cancel integration. With
# the feature enabled, install.sh drops
# `pkg/pipewire-config/99-wintermute-aec.conf` into the system PipeWire
# config dir, and the daemon probes the `wm-mic-aec` virtual source on
# startup (logging `aec_module_missing` if it's not present and
# falling back to the configured / default mic node). PRD-wintermute-audio-aec.
default = ["aec"]
aec = []
# `pipewire-only` is the explicit opt-out used by the AEC vs. no-AEC
# comparison in AC5 of PRD-wintermute-audio-aec. It is a marker — no
# code currently keys off it — so that `--no-default-features
# --features pipewire-only` is a meaningful invocation.
pipewire-only = []
# Opt-in gate for hardware-bound acceptance tests (see README "Hardware
# reality verification"). Off by default so `cargo test` stays green on
# hosts without a microphone or PipeWire graph. Per
# PRD-autobuilder-hardware-mock-convention AC10.
real-hardware = []
