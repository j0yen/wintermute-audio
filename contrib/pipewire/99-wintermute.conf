# wintermute-audio PipeWire drop-in.
#
# Install path: ~/.config/pipewire/pipewire.conf.d/99-wintermute.conf
# (or /etc/pipewire/pipewire.conf.d/99-wintermute.conf for a system install).
#
# Loads `module-echo-cancel` so the laptop's own TTS playback is
# subtracted from the mic signal — without this, every `wm-tts`
# utterance retriggers the wake word and the laptop talks to itself.
#
# AEC3 is preferred. If the local `pipewire` build was compiled
# without AEC3, the daemon falls back to the classic WebRTC AEC and
# logs a warning. To rebuild with AEC3, see the upstream
# `pipewire` PKGBUILD — flag is `--with-aec3`.
#
# Required by PRD-wintermute-audio §2.1.

context.modules = [
  {
    name = libpipewire-module-echo-cancel
    args = {
      monitor.mode = true
      capture.props = {
        node.name = "wm-mic-cancelled"
        node.description = "wintermute echo-cancelled microphone"
      }
      playback.props = {
        node.name = "wm-mic-playback-ref"
        node.description = "wintermute AEC playback reference"
      }
      aec.method = webrtc
      aec.args = {
        webrtc.gain_control = true
        webrtc.noise_suppression = false
        webrtc.aec3 = true
      }
    }
  }
]
