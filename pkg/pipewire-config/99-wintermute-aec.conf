# wintermute-audio AEC drop-in.
#
# Install path: /etc/pipewire/pipewire.conf.d/99-wintermute-aec.conf
# (system-wide), or ~/.config/pipewire/pipewire.conf.d/ for a user
# install. Loads `libpipewire-module-echo-cancel` (WebRTC AEC3 under
# the hood) so the laptop's own TTS playback is subtracted from the mic
# signal — without this, every `wm-tts` utterance retriggers the wake
# word and the daemon hears itself talking.
#
# Creates two virtual nodes:
#   * `wm-mic-aec`  — echo-cancelled microphone source (set
#                     WM_MIC_NODE=wm-mic-aec to consume it).
#   * `wm-spk-aec`  — playback sink used as the AEC reference (route
#                     wm-tts output here, or set as default sink).
#
# Required by PRD-wintermute-audio-aec.

context.modules = [
  {
    name = libpipewire-module-echo-cancel
    args = {
      monitor.mode = false
      capture.props = {
        node.name = "wm-aec-capture"
        node.description = "wintermute AEC capture (raw mic side)"
      }
      playback.props = {
        node.name = "wm-aec-playback"
        node.description = "wintermute AEC playback reference"
      }
      source.props = {
        node.name = "wm-mic-aec"
        node.description = "wintermute echo-cancelled microphone"
        media.class = "Audio/Source"
      }
      sink.props = {
        node.name = "wm-spk-aec"
        node.description = "wintermute AEC speaker (forwards to default sink)"
        media.class = "Audio/Sink"
      }
      aec.method = "webrtc"
      library.name = "aec/libspa-aec-webrtc"
      aec.args = {
        webrtc.gain_control = true
        webrtc.noise_suppression = true
        webrtc.extended_filter = true
      }
    }
  }
]
